<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" width="680" height="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Agent harness architecture with RAG</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="720" fill="#FFFFFF"/>
<rect x="30" y="100" width="620" height="576" rx="20" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
<text x="60" y="131" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">Agent harness</text>
<rect x="150" y="14" width="380" height="74" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="340" y="39" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">User Choice</text>
<text x="340" y="57" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">formatted -&gt;</text>
<text x="340" y="75" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">Prompt: "Give me a 1-week weather forecast for Tokyo"</text>
<path d="M340 88 L340 144" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<rect x="190" y="146" width="300" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340.0" y="170" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">1. Context and memory</text>
<text x="340.0" y="187" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">Messages array + chat history</text>
<path d="M340 198 L340 222" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<rect x="190" y="224" width="300" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340.0" y="248" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">2. Tool schema registry</text>
<text x="340.0" y="265" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">get_weather, search_knowledge_base</text>
<path d="M340 276 L340 300" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<rect x="190" y="302" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340.0" y="326" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">3. LLM inference engine</text>
<text x="340.0" y="343" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">e.g. GPT-5.5 picks a path</text>
<path d="M340 354 L340 374" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<polygon points="340,376 470,410 340,444 210,410" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="340" y="415" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">Which path?</text>
<path d="M210 410 L154 410 L154 480" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<path d="M340 444 L340 480" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<path d="M470 410 L526 410 L526 480" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<text x="182" y="402" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">API tool</text>
<text x="350" y="470" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">RAG</text>
<text x="536" y="384" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">No tool needed</text>
<text x="536" y="400" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">(Rarely used here)</text>
<rect x="72" y="482" width="164" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="154.0" y="507" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Weather API</text>
<text x="154.0" y="526" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">Live Open-Meteo call</text>
<rect x="258" y="482" width="164" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="507" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">RAG engine</text>
<text x="340.0" y="526" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">Embed + vector search</text>
<rect x="444" y="482" width="164" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="526.0" y="507" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle">Return output</text>
<text x="526.0" y="526" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">Formats markdown</text>
<path d="M154 538 L154 588" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<path d="M340 538 L340 588" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<path d="M526 538 L526 588" fill="none" stroke="#73726C" stroke-width="1.5"  marker-end="url(#ah)"/>
<rect x="72" y="590" width="350" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="247.0" y="615" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">4. Append tool result</text>
<text x="247.0" y="634" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">Inject JSON or RAG text as tool msg</text>
<rect x="444" y="590" width="164" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="526.0" y="623.0" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">Response to user</text>
<path d="M72 618 L46 618 L46 172 L188 172" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#al)"/>
<text x="54" y="162" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Loop back (ReAct)</text>
<rect x="40" y="702" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="60" y="712" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Prepare</text>
<rect x="140" y="702" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="160" y="712" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Reason</text>
<rect x="240" y="702" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="260" y="712" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Use tools</text>
<rect x="345" y="702" width="12" height="12" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="365" y="712" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Answer directly</text>
</svg>